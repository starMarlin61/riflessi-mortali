<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pannello di Controllo | Riflessi di una vita mortale</title>
    
    <!-- Libreria Editor Visuale (Quill.js) -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

    <style>
        :root {
            --bg: #111;
            --panel: #222;
            --text: #eee;
            --accent: #cba135;
            --border: #444;
        }
        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background-color: var(--bg); color: var(--text);
            display: flex; height: 100vh; overflow: hidden;
        }
        
        /* SIDEBAR */
        #sidebar {
            width: 300px; background: var(--panel); border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
        }
        .header {
            padding: 20px; border-bottom: 1px solid var(--border);
            font-family: 'Cinzel', serif; font-size: 14px; text-transform: uppercase; color: var(--accent);
        }
        .opera-list { flex-grow: 1; overflow-y: auto; padding: 10px 0; }
        .opera-btn {
            width: 100%; text-align: left; background: none; border: none; 
            color: #aaa; padding: 15px 20px; font-size: 14px; cursor: pointer;
            border-left: 3px solid transparent; transition: 0.2s;
        }
        .opera-btn:hover { background: #333; color: #fff; }
        .opera-btn.active { background: #333; border-left-color: var(--accent); color: #fff; font-weight: bold; }
        
        .add-btn {
            background: transparent; border: 1px dashed var(--border); color: var(--text);
            margin: 10px 20px; padding: 10px; cursor: pointer; transition: 0.3s;
        }
        .add-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* MAIN EDITOR */
        #editor-area {
            flex-grow: 1; display: flex; flex-direction: column; background: var(--bg);
        }
        .editor-header {
            padding: 20px 40px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
        }
        .download-btn {
            background: var(--accent); color: #000; border: none; padding: 12px 24px;
            font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px;
            transition: 0.3s; box-shadow: 0 0 15px rgba(203, 161, 53, 0.2);
        }
        .download-btn:hover { box-shadow: 0 0 25px rgba(203, 161, 53, 0.6); transform: translateY(-2px); }

        /* FORM */
        #form-container {
            padding: 40px; overflow-y: auto; display: none;
        }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group.full { grid-column: span 2; }
        
        label { font-size: 12px; text-transform: uppercase; color: #888; letter-spacing: 1px; }
        input {
            background: #000; border: 1px solid var(--border); color: #fff;
            padding: 12px; font-family: 'Inter', sans-serif; font-size: 14px;
            outline: none; transition: border 0.3s;
        }
        input:focus { border-color: var(--accent); }
        
        /* QUILL EDITOR STYLES (Tema scuro personalizzato) */
        .ql-toolbar.ql-snow {
            background: #e5e5e5; /* Barra chiara per vedere bene le icone */
            border: 1px solid var(--border);
            border-radius: 4px 4px 0 0;
            padding: 5px;
        }
        .ql-container.ql-snow {
            background: #000;
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 4px 4px;
            font-family: 'Georgia', serif;
            font-size: 15px;
            min-height: 150px;
        }
        .ql-editor { color: #fff; }
        .ql-editor p { margin-bottom: 10px; line-height: 1.6; }
        .ql-editor.ql-blank::before { color: #666; font-style: italic; }

        .delete-btn { background: #ff4444; color: white; border: none; padding: 10px; cursor: pointer; margin-top: 20px; }
    </style>
    <!-- Carica il database esistente -->
    <script src="data.js"></script>
</head>
<body>

    <aside id="sidebar">
        <div class="header">Seleziona Opera</div>
        <div class="opera-list" id="opera-list"></div>
        <button class="add-btn" onclick="addNewOpera()">+ Aggiungi Nuova Opera</button>
    </aside>

    <main id="editor-area">
        <div class="editor-header">
            <h2 id="current-editing" style="margin:0; font-family: 'Cinzel', serif; font-weight: normal;">Seleziona un'opera</h2>
            <button class="download-btn" onclick="exportData()">Scarica nuovo data.js</button>
        </div>

        <div id="form-container">
            <div class="form-grid">
                <!-- Dati Base -->
                <div class="form-group">
                    <label>ID Opera (es. orfeo)</label>
                    <input type="text" id="inputId" onchange="updateId(this.value)">
                </div>
                <div class="form-group">
                    <label>Nome File (.glb o immagine)</label>
                    <input type="text" id="field-file" oninput="saveField('file', this.value)">
                </div>
                <div class="form-group">
                    <label>Autore</label>
                    <input type="text" id="field-autore" oninput="saveField('autore', this.value)">
                </div>
                <div class="form-group">
                    <label>Anno</label>
                    <input type="text" id="field-anno" oninput="saveField('anno', this.value)">
                </div>
                <div class="form-group">
                    <label>Titolo dell'opera</label>
                    <input type="text" id="field-titolo" oninput="saveField('titolo', this.value); renderList();">
                </div>
                <div class="form-group">
                    <label>Titolo Inglese</label>
                    <input type="text" id="field-titoloEn" oninput="saveField('titoloEn', this.value)">
                </div>

                <!-- Tecnica sdoppiata per evitare span manuali -->
                <div class="form-group">
                    <label>Tecnica (Italiano)</label>
                    <input type="text" id="field-tecnica-it" oninput="saveTecnica()" placeholder="es. Marmo">
                </div>
                <div class="form-group">
                    <label>Tecnica (Inglese)</label>
                    <input type="text" id="field-tecnica-en" oninput="saveTecnica()" placeholder="es. Marble">
                </div>

                <!-- Dati Musicali -->
                <div class="form-group">
                    <label>Titolo Traccia Musicale</label>
                    <input type="text" id="field-traccia" oninput="saveField('traccia', this.value)">
                </div>
                <div class="form-group">
                    <label>Artista Traccia Musicale</label>
                    <input type="text" id="field-artista" oninput="saveField('artista', this.value)">
                </div>
                
                <!-- Campi di Testo WYSIWYG -->
                <div class="form-group full">
                    <label>Testo Descrittivo</label>
                    <div id="editor-testo"></div>
                </div>
                <div class="form-group full">
                    <label>Poesia</label>
                    <div id="editor-poesia"></div>
                </div>
                <div class="form-group full">
                    <label>Recensione Contemporanea</label>
                    <div id="editor-recensione"></div>
                </div>
                <div class="form-group full">
                    <label>Testo della Canzone</label>
                    <div id="editor-testoCanzone"></div>
                </div>
            </div>
            
            <button class="delete-btn" onclick="deleteCurrentOpera()">Elimina questa opera</button>
        </div>
    </main>

    <script>
        let currentId = null;

        if (typeof databaseOpere === 'undefined') {
            window.databaseOpere = {};
        }

        const simpleFields = ['file', 'autore', 'titolo', 'titoloEn', 'anno', 'traccia', 'artista'];

        // Configurazione dell'Editor Visuale (solo i tasti utili, per non rompere il sito)
        const quillOptions = {
            theme: 'snow',
            formats: ['bold', 'italic', 'underline', 'list'], // Filtra via font e colori incollati per sbaglio
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline'],
                    [{ 'list': 'bullet' }],
                    ['clean'] // Tasto per rimuovere la formattazione
                ]
            }
        };

        // Inizializza i 4 editor
        const quillEditors = {
            testo: new Quill('#editor-testo', quillOptions),
            poesia: new Quill('#editor-poesia', quillOptions),
            recensione: new Quill('#editor-recensione', quillOptions),
            testoCanzone: new Quill('#editor-testoCanzone', quillOptions)
        };

        // Salva i testi automaticamente quando digiti
        Object.keys(quillEditors).forEach(key => {
            quillEditors[key].on('text-change', () => {
                let html = quillEditors[key].root.innerHTML;
                if(html === '<p><br></p>') html = ''; // Pulisce i vuoti
                saveField(key, html);
            });
        });

        function renderList() {
            const list = document.getElementById('opera-list');
            list.innerHTML = '';
            for (let id in databaseOpere) {
                const btn = document.createElement('button');
                btn.className = 'opera-btn' + (id === currentId ? ' active' : '');
                btn.innerText = databaseOpere[id].titolo || id;
                btn.onclick = () => loadOpera(id);
                list.appendChild(btn);
            }
        }

        function loadOpera(id) {
            currentId = id;
            document.getElementById('current-editing').innerText = "Modifica: " + (databaseOpere[id].titolo || id);
            document.getElementById('form-container').style.display = 'block';
            document.getElementById('inputId').value = id;

            // Carica i campi semplici
            simpleFields.forEach(f => {
                const el = document.getElementById('field-' + f);
                if (el) el.value = databaseOpere[id][f] || '';
            });

            // Logica per estrarre e sdoppiare la Tecnica (Italiano/Inglese)
            let tec = databaseOpere[id].tecnica || '';
            let tecIt = tec;
            let tecEn = '';
            if (tec.includes('<span>')) {
                let parts = tec.split('<span>');
                tecIt = parts[0].replace('/', '').trim();
                tecEn = parts[1].replace('</span>', '').trim();
            } else if (tec.includes('/')) {
                let parts = tec.split('/');
                tecIt = parts[0].trim();
                tecEn = parts[1].trim();
            }
            document.getElementById('field-tecnica-it').value = tecIt;
            document.getElementById('field-tecnica-en').value = tecEn;

            // Carica il contenuto nei 4 editor visivi. I tag <p> e <br> vecchi verranno tradotti visivamente!
            quillEditors.testo.root.innerHTML = databaseOpere[id].testo || '';
            quillEditors.poesia.root.innerHTML = databaseOpere[id].poesia || '';
            quillEditors.recensione.root.innerHTML = databaseOpere[id].recensione || '';
            quillEditors.testoCanzone.root.innerHTML = databaseOpere[id].testoCanzone || '';

            renderList();
        }

        function saveField(field, value) {
            if (currentId && databaseOpere[currentId]) {
                databaseOpere[currentId][field] = value;
            }
        }

        function saveTecnica() {
            let it = document.getElementById('field-tecnica-it').value.trim();
            let en = document.getElementById('field-tecnica-en').value.trim();
            let finalValue = it;
            if (en) finalValue += ` / <span>${en}</span>`; // Aggiunge lo span in automatico!
            saveField('tecnica', finalValue);
        }

        function updateId(newId) {
            if (!newId || newId === currentId) return;
            if (databaseOpere[newId]) {
                alert("Questo ID esiste già!");
                document.getElementById('inputId').value = currentId;
                return;
            }
            databaseOpere[newId] = databaseOpere[currentId];
            delete databaseOpere[currentId];
            currentId = newId;
            renderList();
        }

        function addNewOpera() {
            let id = 'nuova_opera';
            let counter = 1;
            while(databaseOpere[id]) {
                id = 'nuova_opera_' + counter;
                counter++;
            }
            databaseOpere[id] = {
                titolo: 'Nuova Opera',
                autore: 'Antonio Canova'
            };
            loadOpera(id);
        }

        function deleteCurrentOpera() {
            if(confirm("Sei sicuro di voler eliminare questa opera?")) {
                delete databaseOpere[currentId];
                currentId = null;
                document.getElementById('form-container').style.display = 'none';
                document.getElementById('current-editing').innerText = "Seleziona un'opera";
                renderList();
            }
        }

        function exportData() {
            let jsContent = "const databaseOpere = {\n";
            
            const keys = Object.keys(databaseOpere);
            keys.forEach((key, index) => {
                jsContent += `    '${key}': {\n`;
                const opera = databaseOpere[key];
                
                const props = Object.keys(opera);
                props.forEach((prop, propIndex) => {
                    let val = opera[prop] || "";
                    
                    if (val.includes('\n') || val.includes('<p>') || val.includes('<br>') || val.length > 50) {
                        val = val.replace(/`/g, '\\`'); 
                        jsContent += `        ${prop}: \`${val}\``;
                    } else {
                        val = val.replace(/'/g, "\\'"); 
                        jsContent += `        ${prop}: '${val}'`;
                    }
                    
                    if (propIndex < props.length - 1) jsContent += ",\n";
                    else jsContent += "\n";
                });
                
                if (index < keys.length - 1) jsContent += "    },\n";
                else jsContent += "    }\n";
            });
            
            jsContent += "};\n";

            const blob = new Blob([jsContent], { type: "text/javascript" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "data.js";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        window.onload = renderList;
    </script>
</body>
</html>
