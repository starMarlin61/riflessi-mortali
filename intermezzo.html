<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Passaggio | I Volti dell'Ignoto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --silver: #e5e5e5;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg);
            color: var(--silver);
            font-family: 'Cinzel', serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- EFFETTO DISTORSIONE (Coerente con le altre pagine) --- */
        .glitch-silver {
            position: fixed; inset: 0;
            background: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 100% 3px;
            pointer-events: none; z-index: 1;
        }

        /* --- CONTENITORE FRASI --- */
        .sequence-container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phrase {
            position: absolute;
            font-size: clamp(1.5rem, 4vw, 3rem);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0;
            filter: blur(10px);
            transform: scale(0.8) translateZ(0);
        }

        /* --- ANIMAZIONI CSS TIMING --- */
        /* Ogni frase ha un ritardo diverso per apparire una dopo l'altra */
        
        .phrase:nth-child(1) {
            animation: cinematicFade 4s ease-in-out 0.5s forwards;
        }
        
        .phrase:nth-child(2) {
            animation: cinematicFade 4s ease-in-out 4.5s forwards;
        }
        
        .phrase:nth-child(3) {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.8em;
            opacity: 0.5;
            animation: cinematicFade 5s ease-in-out 8.5s forwards;
        }

        /* L'animazione: entra dal buio sfocato, diventa nitida e poi ti passa "attraverso" */
        @keyframes cinematicFade {
            0% { opacity: 0; filter: blur(10px); transform: scale(0.8); }
            30% { opacity: 1; filter: blur(0px); transform: scale(1); }
            70% { opacity: 1; filter: blur(0px); transform: scale(1.05); }
            100% { opacity: 0; filter: blur(10px); transform: scale(1.3); }
        }

        /* --- DISSOLVENZA FINALE SCHERMO --- */
        .fade-out-overlay {
            position: fixed; inset: 0;
            background: #000;
            opacity: 0;
            z-index: 100;
            pointer-events: none;
            transition: opacity 2s ease;
        }

    </style>
</head>
<body>

    <div class="glitch-silver"></div>

    <div class="sequence-container">
        <div class="phrase">Hai varcato la soglia</div>
        <div class="phrase">Il marmo non respira... ma ricorda</div>
        <div class="phrase">INIZIALIZZAZIONE MEMORIA</div>
    </div>

    <div class="fade-out-overlay" id="blackout"></div>

    <script>
        // Gestione del redirect automatico
        window.onload = () => {
            const blackout = document.getElementById('blackout');
            
            // Il blackout totale inizia al secondo 12.5
            setTimeout(() => {
                blackout.style.opacity = '1';
            }, 12500);

            // Redirect al museo al secondo 14.5 (quando lo schermo è tutto nero)
            setTimeout(() => {
                window.location.href = 'scelta.html';
            }, 14500);
        };
    </script>

</body>
</html>
