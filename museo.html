<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Santuario | I Volti dell'Ignoto</title>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

    <style>
        :root {
            --bg: #000000;
            --silver: #e5e5e5;
            --deep-silver: #666666;
            --glass: rgba(5, 5, 5, 0.9);
        }

        body {
            margin: 0;
            font-family: 'Cinzel', serif;
            background-color: var(--bg);
            color: var(--silver);
            height: 100vh;
            display: flex;
            overflow: hidden;
            transition: background-color 0.8s ease, color 0.8s ease;
        }

        /* --- EFFETTO DISTORSIONE --- */
        .glitch-silver {
            position: fixed; inset: 0;
            background: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 100% 3px;
            pointer-events: none; z-index: 1;
            transition: opacity 0.8s;
            transform: translateZ(0); 
            will-change: opacity, filter;
        }

        /* --- SIDEBAR MONUMENTALE --- */
        #sidebar {
            position: fixed; left: 0; top: 0; bottom: 0;
            width: 380px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            padding: 80px 50px;
            transform: translateX(0);
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border-right: 1px solid rgba(255,255,255,0.05);
            overflow-y: auto;
            will-change: transform;
        }

        .sidebar-hidden #sidebar { transform: translateX(-100%); }

        /* TOGGLE BUTTON D'ARGENTO */
        #toggle-menu {
            position: fixed; left: 30px; top: 30px; z-index: 101;
            background: none; border: none; cursor: pointer; padding: 10px;
            display: flex; flex-direction: column; gap: 8px;
        }

        .bar { width: 30px; height: 1px; background: var(--silver); transition: 0.5s; }
        body:not(.sidebar-hidden) .bar:nth-child(1) { transform: translateY(4px) rotate(45deg); width: 20px; }
        body:not(.sidebar-hidden) .bar:nth-child(2) { transform: translateY(-5px) rotate(-45deg); width: 20px; }

        /* LISTA OPERE */
        .menu-title { font-size: 10px; letter-spacing: 5px; text-transform: uppercase; color: var(--deep-silver); margin-bottom: 60px; }
        .opera-list { display: flex; flex-direction: column; gap: 20px; }
        .opera-link {
            background: none; border: none; color: rgba(229,229,229,0.3);
            text-align: left; padding: 10px 0; font-size: 14px; letter-spacing: 2px;
            cursor: pointer; transition: 0.4s; text-transform: uppercase; font-family: 'Cinzel', serif;
        }
        .opera-link:hover, .opera-link.active { color: var(--silver); letter-spacing: 4px; text-shadow: 0 0 10px rgba(255,255,255,0.2); }

        /* --- VISUALIZZATORE 3D --- */
        #viewer-container {
            width: 100vw; height: 100vh;
            position: relative; display: flex; flex-direction: column;
            z-index: 10;
        }

        model-viewer {
            width: 100%; height: 100%;
            --poster-color: transparent;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        body.lyrics-open model-viewer, body.past-panel-open model-viewer {
            transform: translateX(-15vw);
        }

        /* TASTO AR (Nascosto ma NON display:none, altrimenti si disattiva la AR) */
        #ar-button {
            position: absolute;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        /* --- SWITCH MODALITÀ --- */
        .mode-switch {
            position: fixed; top: 40px; left: 50%; transform: translateX(-50%);
            z-index: 50; display: flex; gap: 30px; align-items: center;
        }

        .mode-btn {
            font-size: 9px; letter-spacing: 4px; text-transform: uppercase;
            cursor: pointer; opacity: 0.3; transition: 0.5s; padding-bottom: 5px;
            border-bottom: 1px solid transparent;
        }

        .mode-btn.active { opacity: 1; border-bottom-color: var(--silver); }


        /* ========================================= */
        /* --- CARTELLINO MUSEALE ESPANDIBILE ------ */
        /* ========================================= */
        
        #ui-past-label {
            position: fixed; 
            bottom: 60px; 
            left: 60px;
            text-align: left; 
            z-index: 20;
            background: rgba(10, 10, 10, 0.85); /* Sfondo scuro elegante */
            backdrop-filter: blur(10px);
            border-left: 2px solid var(--silver);
            padding: 20px 25px;
            width: 280px;
            max-height: 60px; /* Compresso: mostra solo autore e titolo */
            overflow: hidden;
            transition: max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1), background 0.4s ease, opacity 0.5s ease, transform 0.8s ease;
            cursor: pointer;
            pointer-events: all;
        }

        #ui-past-label:hover {
            max-height: 500px; /* Si espande al passaggio del mouse */
            background: rgba(10, 10, 10, 0.98);
        }

        body.lyrics-open #ui-past-label, body.past-panel-open #ui-past-label { 
            opacity: 0; 
            transform: translateX(-50px); 
            pointer-events: none;
        }

        /* Stili Tipografici Cartellino */
        .placard-author {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--silver);
            margin-bottom: 2px;
        }

        .placard-title {
            font-family: 'Inter', sans-serif;
            font-size: 22px;
            font-weight: 700;
            font-style: italic;
            color: var(--silver);
            line-height: 1.1;
            margin-bottom: 15px;
        }

        .placard-extra {
            opacity: 0;
            transition: opacity 0.4s 0.2s;
        }

        #ui-past-label:hover .placard-extra {
            opacity: 1;
        }

        .placard-dates {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            color: var(--deep-silver);
            margin-bottom: 20px;
        }

        .placard-year {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            color: var(--silver);
            margin-bottom: 5px;
        }

        .placard-title-en {
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 400;
            font-style: italic;
            color: var(--deep-silver);
            margin-bottom: 25px;
        }

        .placard-medium {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--silver);
        }

        .placard-medium span {
            color: var(--deep-silver);
            font-weight: 400;
        }

        /* Sezione QR Code dentro il cartellino */
        .qr-box {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .qr-box:hover { opacity: 0.6; }

        .qr-box svg {
            width: 30px;
            height: 30px;
            fill: var(--silver);
        }

        .qr-box div {
            font-family: 'Inter', sans-serif;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            color: var(--silver);
            line-height: 1.4;
        }


        /* --- UI PASSATO: MENU AZIONI (Destra) --- */
        #ui-past-actions {
            position: fixed; bottom: 60px; right: 60px;
            display: flex; gap: 20px; z-index: 20; pointer-events: all;
            transition: opacity 0.5s ease, transform 0.8s ease;
        }

        body.lyrics-open #ui-past-actions, body.past-panel-open #ui-past-actions { 
            opacity: 0; 
            transform: translateX(50px); 
            pointer-events: none;
        }

        .action-btn {
            background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--silver);
            padding: 12px 24px; font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 3px;
            cursor: pointer; transition: 0.3s; text-transform: uppercase; backdrop-filter: blur(5px);
        }

        .action-btn:hover { background: var(--silver); color: #000; border-color: var(--silver); }


        /* --- PANNELLO LETTURA PASSATO --- */
        #past-panel {
            position: fixed; top: 50%; right: 60px; transform: translateY(-50%) translateX(50px);
            width: 400px; max-width: 85vw; max-height: 70vh;
            background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1);
            padding: 50px 40px; z-index: 100; opacity: 0; pointer-events: none; transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto; box-shadow: -10px 10px 50px rgba(0,0,0,0.8);
        }

        body.past-panel-open #past-panel { 
            opacity: 1; 
            transform: translateY(-50%) translateX(0); 
            pointer-events: all; 
        }

        /* Pulsante Chiusura Visibile */
        .panel-close-btn {
            position: absolute; top: 20px; right: 20px;
            background: transparent; border: 1px solid var(--deep-silver); color: var(--silver);
            width: 35px; height: 35px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 16px; transition: 0.3s;
        }

        .panel-close-btn:hover { background: var(--silver); color: #000; transform: scale(1.1); }

        .panel-section { display: none; }
        .panel-section.active { display: block; animation: fadeInText 0.5s ease; }
        
        @keyframes fadeInText { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .classic-text { font-family: 'Georgia', serif; font-size: 0.95rem; color: rgba(255,255,255,0.7); line-height: 1.8; margin: 0; }
        .classic-text p { margin-bottom: 15px; }
        .poem-text { font-family: 'Georgia', serif; font-style: italic; font-size: 1.1rem; color: var(--silver); line-height: 1.6; text-align: center; }


        /* --- UI PRESENTE (Destra) --- */
        #ui-future {
            position: fixed; bottom: 60px; right: 60px;
            text-align: right; max-width: 450px; z-index: 20; pointer-events: none;
            transition: opacity 0.5s ease, transform 0.8s ease;
        }

        body.lyrics-open #ui-future { opacity: 0; transform: translateX(50px); }

        .future-data { display: none; text-align: right; pointer-events: all; }
        .data-glitch { font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 5px; color: #fff; margin-bottom: 5px; opacity: 0.7; }
        .data-title { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 4rem; letter-spacing: -2px; text-transform: uppercase; margin: 0; line-height: 0.9;}
        .data-artist { font-family: 'Inter', sans-serif; font-size: 14px; letter-spacing: 8px; text-transform: uppercase; opacity: 0.5; margin-top: 10px; }
        
        .modern-review {
            font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 300; line-height: 1.6; margin-top: 25px; margin-bottom: 25px; opacity: 0.8; max-width: 400px; margin-left: auto; max-height: 30vh; overflow-y: auto; padding-right: 10px;
        }
        .modern-review::-webkit-scrollbar { width: 2px; }
        .modern-review::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.3); }

        #btn-listen {
            background: transparent; border: 1px solid #cba135; color: #cba135; padding: 12px 20px; font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 10px; margin-left: auto; transition: all 0.3s ease;
        }
        #btn-listen:hover { background: #cba135; color: #000; box-shadow: 0 0 20px rgba(203, 161, 53, 0.4); }

        #lyrics-panel {
            position: fixed; top: 50%; right: 5vw; transform: translateY(-50%) scale(0.95); width: 450px; max-width: 90%; max-height: 80vh; background-color: #cba135; color: #000; z-index: 200; padding: 40px; opacity: 0; pointer-events: none; transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.8); transform-origin: right center;
        }
        #lyrics-panel.active { opacity: 1; transform: translateY(-50%) scale(1); pointer-events: all; }
        .lyrics-close { position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 24px; color: #000; cursor: pointer; opacity: 0.5; transition: 0.3s; }
        .lyrics-close:hover { opacity: 1; }
        #lyrics-panel-title { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 28px; margin: 0; letter-spacing: -1px; text-transform: uppercase; border-bottom: 2px solid rgba(0,0,0,0.1); padding-bottom: 10px; }
        #lyrics-content { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 14px; line-height: 1.6; margin-top: 20px; }

        /* --- MODALITÀ PRESENTE ATTIVA --- */
        body.future-mode { background-color: #ffffff; color: #000; }
        body.future-mode .glitch-silver { opacity: 0.1; filter: invert(1); }
        body.future-mode #sidebar { background: rgba(255,255,255,0.95); border-right: 1px solid rgba(0,0,0,0.1); }
        body.future-mode .opera-link { color: rgba(0,0,0,0.4); }
        body.future-mode .opera-link:hover, body.future-mode .opera-link.active { color: #000; text-shadow: none; }
        body.future-mode .menu-title { color: #888; }
        body.future-mode .bar { background: #000; }
        body.future-mode #ar-button { border-color: #000; color: #000; }
        body.future-mode #ar-button:hover { background: #000; color: #fff; }
        body.future-mode .mode-btn { color: #000; }
        body.future-mode .mode-btn.active { border-bottom-color: #000; }
        
        body.future-mode #ui-past-label, body.future-mode #ui-past-actions, body.future-mode #past-panel { display: none; }
        body.future-mode .future-data { display: block; color: #000; pointer-events: all; }

        /* --- MOBILE LAYOUT --- */
        @media (max-width: 768px) {
            body { overflow-y: auto; display: block; }
            #sidebar { width: 100%; padding: 100px 30px; }
            #viewer-container { min-height: 100vh; }
            
            #ui-past-label { position: relative; top: auto; left: auto; bottom: auto; margin-top: 80px; width: auto; max-height: none; background: none; border: none; text-align: center; }
            .qr-box { justify-content: center; }
            
            #ui-past-actions { position: relative; top: auto; right: auto; bottom: auto; justify-content: center; padding: 20px 0; }
            
            #past-panel { top: 50%; left: 50%; right: auto; transform: translate(-50%, -50%) scale(0.95); width: 90%; }
            body.past-panel-open #past-panel { transform: translate(-50%, -50%) scale(1); }
            
            #ui-future { position: relative; top: auto; right: auto; bottom: auto; padding: 120px 20px 20px 20px; text-align: center; }
            .future-data { text-align: center; margin-left: auto; margin-right: auto; }
            .modern-review { text-align: center; margin-left: auto; margin-right: auto; }
            #btn-listen { margin: 20px auto 0 auto; justify-content: center; }
            
            .data-title { font-size: 2.5rem; }
            model-viewer { height: 50vh; }
            
            body.lyrics-open model-viewer, body.past-panel-open model-viewer { transform: translateX(0); }
            
            #lyrics-panel {
                top: 50%; left: 50%; right: auto;
                transform: translate(-50%, -50%) scale(0.95);
                transform-origin: center center;
            }
            #lyrics-panel.active { transform: translate(-50%, -50%) scale(1); }
            
            .mode-switch { width: 100%; justify-content: center; top: 20px; }
        }
    </style>
    <script src="data.js"></script>

</head>
<body class="sidebar-hidden" id="main-body">
    <div class="glitch-silver"></div>

    <button id="toggle-menu" onclick="toggleSidebar()">
        <div class="bar"></div>
        <div class="bar"></div>
    </button>

    <div class="mode-switch">
        <span class="mode-btn active" id="btn-past" onclick="setMode('past')">Passato</span>
        <span class="mode-btn" id="btn-future" onclick="setMode('future')">Presente</span>
    </div>

    <aside id="sidebar">
        <div class="menu-title">I Volti dell'Ignoto</div>
        
        <div class="opera-list">
            <button class="opera-link" onclick="updateViewer('orfeo')">01. Orfeo ed Euridice</button>
            <button class="opera-link" onclick="updateViewer('ercole')">02. Ercole e Lica</button>
            <button class="opera-link" onclick="updateViewer('giacente')">03. Maddalena Giacente</button>
            <button class="opera-link" onclick="updateViewer('penitente')">04. Maddalena Penitente</button>
            <button class="opera-link" onclick="updateViewer('amore_psiche')">05. Amore e Psiche</button>
            <button class="opera-link" onclick="updateViewer('perseo')">06. Perseo Trionfante</button>
        </div>
    </aside>

    <main id="viewer-container">
        
        <div id="ui-past-label">
            <div class="placard-author" id="placard-author">Autore</div>
            <div class="placard-title" id="placard-title">Titolo dell'Opera</div>
            
            <div class="placard-extra">
                <div class="placard-dates" id="placard-dates">Date Autore</div>
                <div class="placard-year" id="placard-year">Anno</div>
                <div class="placard-title-en" id="placard-title-en">English Title</div>
                <div class="placard-medium" id="placard-medium">Tecnica</div>
                
                <div class="qr-box" onclick="triggerAR()">
                    <svg viewBox="0 0 24 24">
                        <path d="M3,3H9V9H3V3M5,5V7H7V5H5M15,3H21V9H15V3M17,5V7H19V5H17M3,15H9V21H3V15M5,17V19H7V17H5M11,3H13V5H11V3M11,7H13V9H11V7M11,11H13V13H11V11M11,15H13V17H11V15M11,19H13V21H11V19M15,11H17V13H15V11M17,13H19V15H17V13M19,11H21V13H19V11M19,15H21V17H19V15M15,17H17V19H15V17M17,19H19V21H17V19M19,19H21V21H19V19Z" />
                    </svg>
                    <div>Scansiona per la<br>Realtà Aumentata</div>
                </div>
            </div>
        </div>

        <div id="ui-past-actions">
            <button class="action-btn" onclick="openPastPanel('desc')">L'Opera</button>
            <button class="action-btn" onclick="openPastPanel('poem')">I Versi</button>
        </div>

        <div id="past-panel">
            <button class="panel-close-btn" onclick="closePastPanel()">✕</button>
            <div id="opera-desc" class="panel-section classic-text"></div>
            <div id="opera-poem" class="panel-section poem-text"></div>
        </div>

        <div id="ui-future">
            <div class="future-data">
                <div class="data-glitch">SYS.SYNC_READY</div>
                <h2 class="data-title" id="future-track"></h2>
                <div class="data-artist" id="future-artist"></div>
                
                <div id="modern-review" class="modern-review"></div>
                
                <button id="btn-listen" onclick="toggleLyrics()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12,2C6.48,2 2,6.48 2,12V20A2,2 0 0,0 4,22H6V15H4V12C4,7.58 7.58,4 12,4C16.42,4 20,7.58 20,12V15H18V22H20A2,2 0 0,0 22,20V12C22,6.48 17.52,2 12,2M4,17H6V20H4V17M18,17H20V20H18V17Z"/>
                    </svg>
                    Play Audio
                </button>
            </div>
        </div>

        <div id="lyrics-panel">
            <button class="lyrics-close" onclick="closeLyrics()">✕</button>
            <h3 id="lyrics-panel-title"></h3>
            <div id="lyrics-content"></div>
        </div>

        <model-viewer id="view" 
            src="" 
            bounds="tight"
            camera-controls 
            auto-rotate 
            interaction-prompt="none"
            shadow-intensity="1" 
            environment-image="neutral"
            exposure="0.5"
            ar
            ar-modes="webxr scene-viewer quick-look">
            
            <button slot="ar-button" id="ar-button">Varcare il velo (AR)</button>
        </model-viewer>

        <audio id="modern-audio" loop>
            <source src="musica.mp3" type="audio/mpeg">
        </audio>

    </main>

    <script>
        function toggleSidebar() {
            document.body.classList.toggle('sidebar-hidden');
        }

        // --- ATTIVAZIONE QR CODE NATIVA ---
        function triggerAR() {
            // Esegue un "click" finto sul bottone nativo (che ora è nascosto correttamente fuori schermo)
            const arBtn = document.getElementById('ar-button');
            if (arBtn) {
                arBtn.click();
            }
        }

        // --- GESTIONE INTERAZIONE (DISABLE-PAN) ---
        function updateInteraction() {
            const viewer = document.getElementById('view');
            // Se siamo su Desktop (schermo > 768px), blocchiamo lo spostamento (pan), permettiamo solo zoom e rotazione
            if (window.innerWidth > 768) {
                viewer.setAttribute('disable-pan', '');
            } else {
                // Su mobile, rimuoviamo il blocco per permettere lo spostamento naturale a due dita
                viewer.removeAttribute('disable-pan');
            }
        }

        // --- GESTIONE PANNELLO PASSATO ---
        function openPastPanel(type) {
            document.body.classList.add('past-panel-open');
            
            document.getElementById('opera-desc').classList.remove('active');
            document.getElementById('opera-poem').classList.remove('active');
            
            if (type === 'desc') {
                document.getElementById('opera-desc').classList.add('active');
            } else if (type === 'poem') {
                document.getElementById('opera-poem').classList.add('active');
            }
        }

        function closePastPanel() {
            document.body.classList.remove('past-panel-open');
        }

        function updateViewer(idOpera) {
            const data = databaseOpere[idOpera];
            const viewer = document.getElementById('view');
            
            viewer.src = `models/${data.file}.glb`;
            
            // Popola Cartellino Museale
            document.getElementById('placard-author').innerText = data.autore || "Antonio Canova";
            document.getElementById('placard-title').innerText = data.titolo;
            document.getElementById('placard-dates').innerText = data.dateAutore || "Possagno, 1757 - Venezia, 1822";
            document.getElementById('placard-year').innerText = data.anno || "";
            document.getElementById('placard-title-en').innerText = data.titoloEn || data.titolo;
            document.getElementById('placard-medium').innerHTML = data.tecnica || "Marmo su basamento / <span>Marble</span>";
            
            // Popola Dati Pannelli Passato
            document.getElementById('opera-desc').innerHTML = data.testo;
            document.getElementById('opera-poem').innerHTML = data.poesia;
            
            // Popola Dati Presente
            document.getElementById('future-track').innerText = data.traccia;
            document.getElementById('future-artist').innerText = `// ${data.artista}`;
            document.getElementById('modern-review').innerHTML = data.recensione;
            
            // Popola Pannello Giallo
            document.getElementById('lyrics-panel-title').innerText = data.traccia;
            document.getElementById('lyrics-content').innerHTML = data.testoCanzone;
            
            document.querySelectorAll('.opera-link').forEach(btn => btn.classList.remove('active'));
            if(window.event && window.event.currentTarget) {
                window.event.currentTarget.classList.add('active');
            }

            // Chiudi i pannelli quando si cambia statua
            closePastPanel();
            closeLyrics();

            // Riapplica l'effetto Marmo Nero e gestisce il blocco dello spostamento SOLO dopo che si è centrata
            viewer.addEventListener('load', () => {
                if (document.body.classList.contains('future-mode')) {
                    setMode('future');
                } else {
                    setMode('past');
                }
                
                // Chiama la funzione per bloccare il trascinamento su computer
                updateInteraction();
            }, { once: true });

            // CHIUSURA AUTOMATICA DEL MENU (Per tutti i dispositivi)
            setTimeout(() => { 
                if (!document.body.classList.contains('sidebar-hidden')) {
                    toggleSidebar(); 
                }
            }, 400); 
        }

        async function setMode(mode) {
            const body = document.getElementById('main-body');
            const viewer = document.getElementById('view');
            const audio = document.getElementById('modern-audio');
            
            let material = null;
            if (viewer.model && viewer.model.materials && viewer.model.materials.length > 0) {
                material = viewer.model.materials[0];
            }
            
            if (mode === 'future') {
                body.classList.add('future-mode');
                document.getElementById('btn-future').classList.add('active');
                document.getElementById('btn-past').classList.remove('active');
                
                viewer.exposure = 1.2; 
                viewer.shadowIntensity = 0; 
                
                if (material) {
                    material.pbrMetallicRoughness.setBaseColorFactor([0.02, 0.02, 0.02, 1]); 
                    material.pbrMetallicRoughness.setRoughnessFactor(0.05); 
                    material.pbrMetallicRoughness.setMetallicFactor(0.2); 
                }
                
                closePastPanel();
                
            } else {
                body.classList.remove('future-mode');
                document.getElementById('btn-past').classList.add('active');
                document.getElementById('btn-future').classList.remove('active');
                
                viewer.exposure = 0.5; 
                viewer.shadowIntensity = 0.4;
                
                if (material) {
                    material.pbrMetallicRoughness.setBaseColorFactor([1, 1, 1, 1]); 
                    material.pbrMetallicRoughness.setRoughnessFactor(0.6); 
                    material.pbrMetallicRoughness.setMetallicFactor(0); 
                }
                
                audio.pause();
                closeLyrics();
            }
        }

        function toggleLyrics() {
            const body = document.getElementById('main-body');
            const panel = document.getElementById('lyrics-panel');
            const audio = document.getElementById('modern-audio');
            
            body.classList.add('lyrics-open');
            panel.classList.add('active');
            
            if(audio.paused) {
                audio.play();
            }
        }

        function closeLyrics() {
            document.getElementById('main-body').classList.remove('lyrics-open');
            document.getElementById('lyrics-panel').classList.remove('active');
        }
        
        // Inizializza l'opera in base alla scelta dell'utente
        window.onload = () => {
            const parametriUrl = new URLSearchParams(window.location.search);
            const operaScelta = parametriUrl.get('opera');
            
            if (operaScelta && typeof databaseOpere !== 'undefined' && databaseOpere[operaScelta]) {
                updateViewer(operaScelta);
            } else if (typeof databaseOpere !== 'undefined') {
                updateViewer('perseo');
            } else {
                console.error("Errore: databaseOpere non trovato. Assicurati che data.js sia caricato correttamente.");
            }
            
            // Imposta l'interazione iniziale
            updateInteraction();
        };

        // Aggiorna l'interazione se l'utente ridimensiona la finestra
        window.addEventListener('resize', updateInteraction);

        // --- SCORCIATOIA DA TASTIERA (Tasto 'F') ---
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            
            if (e.key.toLowerCase() === 'f') {
                toggleFullScreen();
            }
        });

        // --- LOGICA FULLSCREEN ---
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Errore attivazione schermo intero: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        };
    </script>
</body>
</html>
